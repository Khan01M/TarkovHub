# Автосборка: сайт (GitHub Pages), APK для Android, EXE для Windows, DMG для macOS.
# Запускается при каждом push в main и вручную (Actions → Build → Run workflow).
# Если поставить тег v1.0.0 — файлы приложатся к GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# По умолчанию — только чтение. Права на запись выдаются точечно тем задачам, которым они нужны.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      - name: Иконка приложения
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp build/icon.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk TarkovHub.apk
      - uses: actions/upload-artifact@v4
        with: { name: TarkovHub-android, path: TarkovHub.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with: { name: TarkovHub-windows, path: release/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: TarkovHub-macos, path: release/*.dmg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true, pattern: 'TarkovHub-*' }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with: { files: out/* }
